name: Linux x64 tar.gz

run-name: ${{ github.ref_name }} Linux x64 tar.gz

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and publish, for example 4.4.7"
        required: false
        type: string
      upload_symbols:
        description: "Upload this candidate build's Sentry symbols without publishing packages"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      archive_name: ${{ steps.meta.outputs.archive_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
      flutter_version: ${{ steps.frozen.outputs.flutter_version }}
      adapter_ref: ${{ steps.frozen.outputs.adapter_ref }}
      upload_huggingface: ${{ steps.frozen.outputs.upload_huggingface }}
      upload_modelscope: ${{ steps.frozen.outputs.upload_modelscope }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          sparse-checkout: |
            pubspec.yaml
            release.json
            scripts/release_identity.py
          sparse-checkout-cone-mode: false

      - name: Validate frozen release
        id: frozen
        env:
          RWKV_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/release_identity.py --github-output "$GITHUB_OUTPUT"

      - name: Extract version metadata
        id: meta
        run: |
          VERSION_LINE=$(grep "^version:" pubspec.yaml)
          VERSION=$(echo "$VERSION_LINE" | sed 's/version: //' | sed 's/+.*//')
          BUILD_NUMBER=$(echo "$VERSION_LINE" | sed 's/.*+//')
          if [ -z "$BUILD_NUMBER" ]; then BUILD_NUMBER="1"; fi

          ARCHIVE_NAME="rwkv_chat_${VERSION}_${BUILD_NUMBER}_linux-x64.tar.gz"
          MANUAL_RELEASE_TAG="${{ inputs.release_tag }}"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            SHOULD_PUBLISH="true"
          elif [ -n "$MANUAL_RELEASE_TAG" ]; then
            RELEASE_TAG="$MANUAL_RELEASE_TAG"
            SHOULD_PUBLISH="true"
          else
            RELEASE_TAG=""
            SHOULD_PUBLISH="false"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "should_publish=$SHOULD_PUBLISH" >> $GITHUB_OUTPUT

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Checkout rwkv_mobile_flutter dependency
        uses: actions/checkout@v4
        with:
          repository: RWKV-APP/rwkv_mobile_flutter
          ref: ${{ needs.setup.outputs.adapter_ref }}
          path: rwkv_mobile_flutter
          fetch-depth: 1

      - name: Verify pinned native libraries
        run: python rwkv_mobile_flutter/tools/fetch_native_libraries.py --verify-only --platform linux-x64

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.setup.outputs.flutter_version }}
          channel: "stable"
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libcurl4-openssl-dev

      - name: Override dependency path
        run: |
          echo "dependency_overrides:" > pubspec_overrides.yaml
            echo "  flutter_inappwebview_windows:" >> pubspec_overrides.yaml
            echo "    path: packages/flutter_inappwebview_windows" >> pubspec_overrides.yaml
            echo "  proxy_setting_android:" >> pubspec_overrides.yaml
            echo "    git:" >> pubspec_overrides.yaml
            echo "      url: https://github.com/dengzii/proxy_setting.git" >> pubspec_overrides.yaml
            echo "      path: packages/proxy_setting_android" >> pubspec_overrides.yaml
            echo "      ref: main" >> pubspec_overrides.yaml
            echo "  rwkv_downloader:" >> pubspec_overrides.yaml
            echo "    git:" >> pubspec_overrides.yaml
            echo "      url: https://github.com/RWKV-APP/rwkv_downloader.git" >> pubspec_overrides.yaml
            echo "      ref: v1" >> pubspec_overrides.yaml
            echo "  rwkv_mobile_flutter:" >> pubspec_overrides.yaml
            echo "    path: ./rwkv_mobile_flutter" >> pubspec_overrides.yaml

      - name: Create .env file
        uses: ./.github/actions/create-env
        with:
          x_api_key: ${{ secrets.X_API_KEY }}

      - name: Decrypt sensitive assets
        uses: ./.github/actions/decrypt-assets
        with:
          filter_decrypt_pass: ${{ secrets.FILTER_DECRYPT_PASS }}

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Build Linux x64
        run: >
          flutter build linux
          --release
          --target-platform linux-x64
          --split-debug-info=build/sentry-symbols/linux-x64
          --dart-define=SENTRY_RELEASE=rwkv-chat@${{ needs.setup.outputs.version }}+${{ needs.setup.outputs.build_number }}
          --dart-define=SENTRY_DIST=${{ needs.setup.outputs.build_number }}

      - name: Ensure crashpad handler is executable
        run: |
          CRASHPAD_HANDLER="build/linux/x64/release/bundle/lib/crashpad_handler"
          test -f "$CRASHPAD_HANDLER"
          chmod 755 "$CRASHPAD_HANDLER"
          test -x "$CRASHPAD_HANDLER"

      - name: Remove aarch64 libraries
        run: |
          LIB_DIR="build/linux/x64/release/bundle/lib"
          if [ -d "$LIB_DIR" ]; then
            REMOVED_COUNT=0
            for file in "$LIB_DIR"/*aarch64*.so "$LIB_DIR"/*arm64*.so; do
              if [ -f "$file" ]; then
                echo "Removing: $(basename "$file")"
                rm -f "$file"
                REMOVED_COUNT=$((REMOVED_COUNT + 1))
              fi
            done
            echo "Removed $REMOVED_COUNT aarch64 library file(s)"
          fi

      - name: Upload Sentry debug files
        if: needs.setup.outputs.should_publish == 'true' || inputs.upload_symbols == true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN secret is required for Sentry symbol upload" >&2
            exit 1
          fi
          dart run sentry_dart_plugin \
            --sentry-define=org=ce-wang \
            --sentry-define=project=rwkv_app \
            --sentry-define=symbols_path=build/sentry-symbols/linux-x64 \
            --sentry-define=release=rwkv-chat@${{ needs.setup.outputs.version }}+${{ needs.setup.outputs.build_number }} \
            --sentry-define=dist=${{ needs.setup.outputs.build_number }}

      - name: Create archive
        id: create-archive
        env:
          ARCHIVE_NAME: ${{ needs.setup.outputs.archive_name }}
        run: |
          tar -czf "$GITHUB_WORKSPACE/$ARCHIVE_NAME" -C build/linux/x64/release/bundle .

          ARCHIVE_FULL_PATH="$GITHUB_WORKSPACE/$ARCHIVE_NAME"
          echo "archive_path=$ARCHIVE_FULL_PATH" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-archive
          path: ${{ steps.create-archive.outputs.archive_path }}
          retention-days: 7
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [setup, build]
    if: needs.setup.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release identity
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          sparse-checkout: |
            pubspec.yaml
            release.json
            scripts/release_identity.py
          sparse-checkout-cone-mode: false

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-archive

      - name: Upload verified GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_identity.py --upload-github "*.tar.gz"

  upload-providers:
    name: Upload enabled providers
    needs: [setup, build]
    if: needs.setup.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upload script
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          sparse-checkout: |
            scripts/upload_to_hf.py
            scripts/upload_to_modelscope.py
          sparse-checkout-cone-mode: false

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x64-archive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face dependency
        if: needs.setup.outputs.upload_huggingface == 'true'
        run: pip install huggingface_hub

      - name: Upload to HuggingFace
        if: needs.setup.outputs.upload_huggingface == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT || 'https://huggingface.co' }}
          HF_DATASETS_ID: ${{ secrets.HF_DATASETS_ID || 'HaloWang/rwkv-chat' }}
          ARCHIVE_NAME: ${{ needs.setup.outputs.archive_name }}
        run: |
          python scripts/upload_to_hf.py \
            --repo-id "$HF_DATASETS_ID" \
            --file "$ARCHIVE_NAME" \
            --path-in-repo "linux-x64/$ARCHIVE_NAME" \
            --hf-token "$HF_TOKEN" \
            --hf-endpoint "$HF_ENDPOINT"

      - name: Install ModelScope dependency
        if: needs.setup.outputs.upload_modelscope == 'true'
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        run: |
          if [ -z "${MODELSCOPE_API_TOKEN:-}" ]; then echo "MODELSCOPE_API_TOKEN is required by release.json" >&2; exit 1; fi
          pip install modelscope-hub

      - name: Upload to ModelScope
        if: needs.setup.outputs.upload_modelscope == 'true'
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          MODELSCOPE_ENDPOINT: ${{ secrets.MODELSCOPE_ENDPOINT || 'https://modelscope.cn' }}
          MODELSCOPE_REPO_ID: ${{ secrets.MODELSCOPE_REPO_ID || 'HaloWang1991/rwkv-chat' }}
          MODELSCOPE_REVISION: ${{ secrets.MODELSCOPE_REVISION || 'master' }}
          ARCHIVE_NAME: ${{ needs.setup.outputs.archive_name }}
        run: |
          if [ -z "${MODELSCOPE_API_TOKEN:-}" ]; then echo "MODELSCOPE_API_TOKEN is required by release.json" >&2; exit 1; fi
          python scripts/upload_to_modelscope.py \
            --repo-id "$MODELSCOPE_REPO_ID" \
            --file "$ARCHIVE_NAME" \
            --path-in-repo "linux-x64/$ARCHIVE_NAME" \
            --endpoint "$MODELSCOPE_ENDPOINT" \
            --revision "$MODELSCOPE_REVISION"
