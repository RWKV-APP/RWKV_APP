name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate frozen release
        id: frozen
        run: python3 scripts/release_identity.py --github-output "$GITHUB_OUTPUT"

      - name: Checkout rwkv_mobile_flutter dependency
        uses: actions/checkout@v4
        with:
          repository: RWKV-APP/rwkv_mobile_flutter
          ref: ${{ steps.frozen.outputs.adapter_ref }}
          path: rwkv_mobile_flutter
          fetch-depth: 1

      - name: Link rwkv_mobile_flutter sibling path
        run: ln -sfn "$GITHUB_WORKSPACE/rwkv_mobile_flutter" "$GITHUB_WORKSPACE/../rwkv_mobile_flutter"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.frozen.outputs.flutter_version }}
          channel: "stable"
          cache: true

      - name: Override dependency path
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            flutter_inappwebview_windows:
              path: packages/flutter_inappwebview_windows
            proxy_setting_android:
              git:
                url: https://github.com/dengzii/proxy_setting.git
                path: packages/proxy_setting_android
                ref: main
            rwkv_downloader:
              git:
                url: https://github.com/RWKV-APP/rwkv_downloader.git
                ref: v1
            rwkv_mobile_flutter:
              path: ./rwkv_mobile_flutter
          YAML

      - name: Create minimal test environment
        uses: ./.github/actions/create-env
        with:
          x_api_key: ""

      - name: Create placeholder sensitive assets
        uses: ./.github/actions/decrypt-assets
        with:
          filter_decrypt_pass: ${{ secrets.FILTER_DECRYPT_PASS }}

      - name: Install app dependencies
        run: flutter pub get

      - name: Analyze app
        run: dart analyze

      - name: Test app
        run: flutter test

      - name: Install local web search dependencies
        working-directory: packages/local_web_search
        run: flutter pub get

      - name: Analyze local web search
        working-directory: packages/local_web_search
        run: dart analyze

      - name: Test local web search
        working-directory: packages/local_web_search
        run: flutter test

      - name: Install local web search example dependencies
        working-directory: packages/local_web_search/example
        run: flutter pub get

      - name: Analyze local web search example
        working-directory: packages/local_web_search/example
        run: dart analyze

      - name: Install tools dependencies
        working-directory: tools
        run: flutter pub get

      - name: Analyze tools
        working-directory: tools
        run: dart analyze

      - name: Test tools
        working-directory: tools
        run: dart test

      - name: Check Specification
        working-directory: tools
        run: dart run bin/check_specification.dart --root ..
