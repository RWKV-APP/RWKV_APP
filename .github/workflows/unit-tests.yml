name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout rwkv_mobile_flutter dependency
        uses: actions/checkout@v4
        with:
          repository: MollySophia/rwkv_mobile_flutter
          ref: dev
          path: rwkv_mobile_flutter
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Override dependency path
        run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            proxy_setting_android:
              git:
                url: https://github.com/dengzii/proxy_setting.git
                path: packages/proxy_setting_android
                ref: main
            rwkv_downloader:
              git:
                url: https://github.com/RWKV-APP/rwkv_downloader.git
                ref: v1
            rwkv_mobile_flutter:
              path: ./rwkv_mobile_flutter
          YAML

      - name: Create minimal test environment
        uses: ./.github/actions/create-env
        with:
          x_api_key: ""

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze app
        run: dart analyze

      - name: Test app
        run: flutter test

      - name: Install local web search dependencies
        working-directory: packages/local_web_search
        run: flutter pub get

      - name: Analyze local web search
        working-directory: packages/local_web_search
        run: dart analyze

      - name: Test local web search
        working-directory: packages/local_web_search
        run: flutter test
